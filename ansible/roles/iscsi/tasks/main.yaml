- name: Configure iSCSI initiator
  become: true
  block:
    - name: Install open-iscsi
      ansible.builtin.apt:
        pkg:
          - open-iscsi
        state: present
        update_cache: true

    - name: Set unique initiator name
      ansible.builtin.copy:
        content: "InitiatorName=iqn.2026-08.io.mchill:{{ ansible_hostname }}\n"
        dest: /etc/iscsi/initiatorname.iscsi
        owner: root
        group: root
        mode: "0600"
      register: iscsi_initiator_name

    - name: Set iSCSI session replacement timeout
      ansible.builtin.lineinfile:
        path: /etc/iscsi/iscsid.conf
        regexp: '^\s*#?\s*node\.session\.timeo\.replacement_timeout\s*='
        line: "node.session.timeo.replacement_timeout = 3600"
        owner: root
        group: root
        mode: "0600"
      register: iscsi_replacement_timeout

    - name: Apply replacement timeout to existing node records
      ansible.builtin.command:
        cmd: >-
          iscsiadm -m node -o update
          -n node.session.timeo.replacement_timeout
          -v 3600
      register: iscsi_node_update
      changed_when: iscsi_node_update.rc == 0
      failed_when: iscsi_node_update.rc not in [0, 21]

    - name: Create iscsid drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/iscsid.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Order iscsid after systemd-resolved
      ansible.builtin.copy:
        content: |
          [Unit]
          After=systemd-resolved.service
        dest: /etc/systemd/system/iscsid.service.d/after-resolved.conf
        owner: root
        group: root
        mode: "0644"

    - name: Restart iscsid service
      when: iscsi_initiator_name.changed or iscsi_replacement_timeout.changed
      ansible.builtin.systemd:
        name: iscsid
        state: restarted
        daemon_reload: true

    - name: Enable iscsid service
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started
        daemon_reload: true

    - name: Enable open-iscsi service
      ansible.builtin.systemd:
        name: open-iscsi
        enabled: true
