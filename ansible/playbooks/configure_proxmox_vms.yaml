- name: Configure k3s Servers
  hosts: k3s_servers
  roles:
    - oh_my_zsh
    - qemu_guest_agent
    - nic_offload
    - inotify
    - iscsi
    - etcd_disk
    - k3s_server

- name: Configure k3s Agents
  hosts: k3s_agents
  roles:
    - oh_my_zsh
    - qemu_guest_agent
    - nic_offload
    - inotify
    - iscsi
    - gpu
    - k3s_agent
