apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr-uhd
spec:
  selector:
    matchLabels:
      app: sonarr-uhd
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sonarr-uhd
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: sonarr
          image: ghcr.io/linuxserver/sonarr:4.0.19
          ports:
            - name: ingress
              containerPort: 8989
          env:
            - name: TZ
              value: America/New_York
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: MAX_NAME
              value: "140"
          volumeMounts:
            - name: sonarr-uhd
              mountPath: /config
            - name: shows-uhd
              mountPath: /tv-uhd
              subPath: uhd
            - name: sonarr-uhd-trash
              mountPath: /trash
            - name: qbittorrent-bulk
              mountPath: /data
      volumes:
        - name: sonarr-uhd
          persistentVolumeClaim:
            claimName: sonarr-uhd
        - name: sonarr-uhd-trash
          persistentVolumeClaim:
            claimName: sonarr-uhd-trash
        - name: qbittorrent-bulk
          persistentVolumeClaim:
            claimName: qbittorrent-bulk
        - name: shows-uhd
          persistentVolumeClaim:
            claimName: shows-uhd
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 10m
          memory: 512Mi
