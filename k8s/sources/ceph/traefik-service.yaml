apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: ceph
spec:
  weighted:
    services:
      - name: beelink1
        kind: Service
        port: 8080
        weight: 1
        healthCheck:
          path: /
          interval: 5s
          timeout: 1s
      - name: beelink2
        kind: Service
        port: 8080
        weight: 1
        healthCheck:
          path: /
          interval: 5s
          timeout: 1s
      - name: beelink3
        kind: Service
        port: 8080
        weight: 1
        healthCheck:
          path: /
          interval: 5s
          timeout: 1s
    sticky:
      cookie:
        name: ceph
        secure: true
        httpOnly: true
