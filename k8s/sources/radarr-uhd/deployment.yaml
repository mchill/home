apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr-uhd
spec:
  selector:
    matchLabels:
      app: radarr-uhd
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: radarr-uhd
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: radarr
          image: ghcr.io/linuxserver/radarr:5.28.0
          ports:
            - name: ingress
              containerPort: 7878
          env:
            - name: TZ
              value: America/New_York
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: MAX_NAME
              value: "140"
          volumeMounts:
            - name: radarr-uhd
              mountPath: /config
            - name: movies-uhd
              mountPath: /movies-uhd
              subPath: uhd
            - name: radarr-uhd-trash
              mountPath: /trash
            - name: qbittorrent-bulk
              mountPath: /data
      volumes:
        - name: radarr-uhd
          persistentVolumeClaim:
            claimName: radarr-uhd
        - name: radarr-uhd-trash
          persistentVolumeClaim:
            claimName: radarr-uhd-trash
        - name: qbittorrent-bulk
          persistentVolumeClaim:
            claimName: qbittorrent-bulk
        - name: movies-uhd
          persistentVolumeClaim:
            claimName: movies-uhd
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 10m
          memory: 512Mi
