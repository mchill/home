apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: volume-recovery
spec:
  selector:
    matchLabels:
      app: volume-recovery
  template:
    metadata:
      labels:
        app: volume-recovery
    spec:
      serviceAccountName: volume-recovery
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: recovery
          image: python:3.13-alpine
          command:
            - python3
            - /app/recover.py
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: INTERVAL
              value: "30"
          volumeMounts:
            - name: config
              mountPath: /app
            - name: proc
              mountPath: /host/proc
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: volume-recovery
        - name: proc
          hostPath:
            path: /proc
            type: Directory
      resources:
        limits:
          memory: 64Mi
        requests:
          cpu: 10m
          memory: 64Mi
