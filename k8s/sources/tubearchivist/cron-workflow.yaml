apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: tubearchivist
spec:
  schedules:
    - 0 0 * * *
  timezone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 30
  failedJobsHistoryLimit: 30
  workflowSpec:
    activeDeadlineSeconds: 3600
    podGC:
      strategy: OnWorkflowCompletion
    entrypoint: tubearchivist
    onExit: notify
    volumes:
      - name: media
        persistentVolumeClaim:
          claimName: media
      - name: config
        configMap:
          name: tubearchivist-sync
    templates:
      - name: tubearchivist
        retryStrategy:
          limit: "2"
        container:
          image: python:3.15.2-alpine
          command:
            - python
            - -u
            - /config/sync.py
          env:
            - name: TZ
              value: America/New_York
            - name: TA_SERVER
              value: http://tubearchivist.server.svc.cluster.local
            - name: TA_MEDIA_FOLDER
              value: ../../tubearchivist
            - name: TARGET_FOLDER
              value: /youtube/symlinks
          envFrom:
            - secretRef:
                name: tubearchivist
          volumeMounts:
            - name: media
              mountPath: /youtube
              subPath: youtube
            - name: config
              mountPath: /config
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 64Mi
      - name: notify
        container:
          image: alpine:3.24
          command:
            - sh
            - -c
          args:
            - |
              if [ "{{workflow.status}}" = "Failed" ]; then
                apk add --no-cache curl;
                curl -X POST "$HOMEASSISTANT_WEBHOOK" \
                  -H "Content-Type: application/json" \
                  -d "{\"workflow\": \"{{workflow.name}}\", \"status\": \"{{workflow.status}}\"}";
              fi
          envFrom:
            - secretRef:
                name: homeassistant-webhook
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 128Mi
