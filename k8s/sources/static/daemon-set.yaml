apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: static
spec:
  selector:
    matchLabels:
      app: static
  template:
    metadata:
      labels:
        app: static
    spec:
      containers:
        - name: static
          image: nginx:1.31.3
          ports:
            - name: ingress
              containerPort: 80
          env:
            - name: TZ
              value: America/New_York
          volumeMounts:
            - name: hddpool1-media
              mountPath: /usr/share/nginx/html/podcasts
              subPath: podcasts
      volumes:
        - name: hddpool1-media
          persistentVolumeClaim:
            claimName: hddpool1-media
      resources:
        limits:
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 128Mi
