apiVersion: apps/v1
kind: Deployment
metadata:
  name: truenas-unlock
spec:
  selector:
    matchLabels:
      app: truenas-unlock
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: truenas-unlock
    spec:
      containers:
        - name: truenas-unlock
          image: thorpejosh/truenas-zfs-unlock:v3.1.2
          command:
            - /bin/sh
            - -c
            - |
              set -e
              chmod u+w /usr/local/bin/unlock
              sed 's|^\( *\)dataset="\${var##\*__}".*|\1dataset="$$(printf %s "${var#*__}" \| sed "s#__#/#g")"|' /usr/local/bin/unlock > /tmp/unlock
              cat /tmp/unlock > /usr/local/bin/unlock
              grep -q 's#__#/#g' /usr/local/bin/unlock || { echo "unlock patch did not apply"; exit 1; }
              exec /bin/sh /entry.sh
          env:
            - name: TZ
              value: America/New_York
            - name: TRUENAS_HOST
              value: truenas.mchill.lan
            - name: SKIP_CERT_VERIFY
              value: "true"
            - name: CRONTAB
              value: "*/10 * * * * * * unlock"
          envFrom:
            - secretRef:
                name: truenas-unlock
      resources:
        limits:
          memory: 128Mi
        requests:
          cpu: 10m
          memory: 128Mi
