apiVersion: apps/v1
kind: Deployment
metadata:
  name: photon
spec:
  selector:
    matchLabels:
      app: photon
  replicas: 0
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: photon
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: stage-index
          image: rtuszik/photon-docker:2.3.1
          command:
            - /bin/bash
            - -c
            - |
              set -eu
              if [ -d /photon/data/photon_data/node_1 ]; then
                echo "index already staged"
                exit 0
              fi
              df -h /photon/data
              rm -rf /photon/data/.staging
              cp -a /nas/photon_data /photon/data/.staging
              mv /photon/data/.staging /photon/data/photon_data
              chown -R 9011:9011 /photon/data/photon_data
              du -sh /photon/data/photon_data
              df -h /photon/data
          volumeMounts:
            - name: hddpool1-apps
              mountPath: /nas
              subPath: photon
              readOnly: true
            - name: data
              mountPath: /photon/data
      containers:
        - name: photon
          image: rtuszik/photon-docker:2.3.1
          ports:
            - name: ingress
              containerPort: 2322
          env:
            - name: TIME_ZONE
              value: America/New_York
            - name: UPDATE_STRATEGY
              value: DISABLED
            - name: INITIAL_DOWNLOAD
              value: "FALSE"
            - name: SKIP_MD5_CHECK
              value: "TRUE"
          readinessProbe:
            httpGet:
              path: /status
              port: ingress
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /photon/data
      volumes:
        - name: hddpool1-apps
          persistentVolumeClaim:
            claimName: hddpool1-apps
        - name: data
          emptyDir:
            sizeLimit: 40Gi
      resources:
        limits:
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 2Gi
