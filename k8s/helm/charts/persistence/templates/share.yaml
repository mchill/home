{{- if and (eq (include "persistence.type" .) "smb") .Values.createShare }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Values.app }}-share"
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ensure-share
          image: alpine:3.23
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              apk add --no-cache curl jq >/dev/null;
              API="http://truenas.mchill.lan/api/v2.0";
              AUTH="Authorization: Bearer $TRUENAS_API_KEY";
              DATASET="{{ include "persistence.dataset" . }}";
              SHARE="{{ include "persistence.share" . }}";
              ENC=$(printf '%s' "$DATASET" | sed 's|/|%2F|g');
              if [ "$(curl -sf -H "$AUTH" "$API/pool/dataset?id=$ENC" | jq 'length')" != "1" ]; then
                curl -sf -X POST -H "$AUTH" -H 'Content-Type: application/json' \
                  -d "{\"name\":\"$DATASET\",\"type\":\"FILESYSTEM\"}" "$API/pool/dataset" >/dev/null;
                echo "created dataset $DATASET";
              fi;
              if [ "$(curl -sf -H "$AUTH" "$API/sharing/smb" | jq --arg n "$SHARE" '[.[]|select(.name==$n)]|length')" = "0" ]; then
                curl -sf -X POST -H "$AUTH" -H 'Content-Type: application/json' \
                  -d "{\"name\":\"$SHARE\",\"path\":\"/mnt/$DATASET\",\"purpose\":\"DEFAULT_SHARE\",\"enabled\":true}" \
                  "$API/sharing/smb" >/dev/null;
                echo "created smb share $SHARE -> /mnt/$DATASET";
              else
                echo "smb share $SHARE already exists";
              fi
          env:
            - name: TRUENAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: truenas-api
                  key: TRUENAS_API_KEY
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 128Mi
{{- end }}
